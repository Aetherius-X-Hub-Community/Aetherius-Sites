<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetherius X Hub Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090d; --surface:#10121a; --surface-2:#161923; --surface-3:#1e2230;
    --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.12);
    --text:#e8ebf2; --muted:#8a92a6;
    --blurple:#5865f2; --blurple-2:#7c85ff; --purple:#9d7bff;
    --green:#23a55a; --red:#ed4245;
    --radius:16px;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sidebar-width: 280px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;display:flex}
  
  .ambient-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 15% 0%,rgba(88,101,242,0.12) 0%,transparent 45%),radial-gradient(circle at 85% 100%,rgba(157,123,255,0.08) 0%,transparent 45%)}
  .app-container{display:flex;width:100%;min-height:100vh;position:relative;z-index:1}
  
  /* Sidebar */
  .sidebar{width:var(--sidebar-width);background:rgba(16,18,26,0.75);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:32px 20px;position:fixed;top:0;bottom:0;left:0;z-index:100}
  .brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:17px;letter-spacing:-0.02em;margin-bottom:40px;padding-left:8px}
  .brand .logo-dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--blurple),var(--purple));box-shadow:0 0 12px rgba(88,101,242,0.6);animation:pulse-glow 3s ease-in-out infinite}
  @keyframes pulse-glow{0%,100%{transform:scale(1);box-shadow:0 0 12px rgba(88,101,242,0.6)}50%{transform:scale(1.15);box-shadow:0 0 20px rgba(157,123,255,0.8)}}
  .nav-links{display:flex;flex-direction:column;gap:6px;flex:1}
  .nav-link{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:14.5px;font-weight:600;transition:all 0.25s;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit;position:relative;overflow:hidden}
  .nav-link::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:0;background:var(--blurple-2);border-radius:0 4px 4px 0;transition:height 0.25s}
  .nav-link:hover{background:var(--surface-2);color:var(--text)}
  .nav-link.active{background:rgba(88,101,242,0.1);color:var(--text)}
  .nav-link.active::before{height:60%}
  .nav-link svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke 0.25s}
  .nav-link.active svg{stroke:var(--blurple-2)}
  .sidebar-footer{margin-top:auto;padding-top:24px;border-top:1px solid var(--border)}
  .sidebar-footer .btn{width:100%;margin-bottom:12px}
  .version-tag{font-size:11px;color:#4a5265;text-align:center;cursor:default;user-select:none}
  
  /* Main Content */
  .main-content{flex:1;margin-left:var(--sidebar-width);padding:0 48px 120px;max-width:1300px;width:100%}
  .hero{padding:90px 0 70px;text-align:center}
  .pill{display:inline-flex;align-items:center;gap:10px;padding:9px 20px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:14px;color:var(--muted);margin-bottom:32px;box-shadow:0 8px 30px rgba(0,0,0,0.3)}
  .pill b{color:var(--text);font-weight:750;font-variant-numeric:tabular-nums}
  .pill .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(35,165,90,0.15);animation:pulse-green 2.4s ease-in-out infinite}
  @keyframes pulse-green{50%{opacity:.4;box-shadow:0 0 0 6px rgba(35,165,90,0.05)}}
  .approx-badge{font-size:10px;background:var(--surface-3);padding:3px 8px;border-radius:6px;color:var(--muted);font-weight:600;letter-spacing:0.02em}
  h1{font-size:clamp(38px,6vw,64px);line-height:1.1;letter-spacing:-0.04em;font-weight:800;margin-bottom:22px}
  h1 span{background:linear-gradient(135deg,#8b93ff 0%,#c4b5fd 50%,#7dd3fc 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:17px;line-height:1.7;max-width:580px;margin:0 auto 40px}
  
  /* Script Section */
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
  .section-head h2{font-size:22px;font-weight:750;letter-spacing:-0.02em}
  .section-head p{color:var(--muted);font-size:14px;margin-top:6px}
  .count-tag{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:7px 14px;border-radius:999px;font-weight:600}
  
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:24px;padding-bottom:60px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;display:flex;flex-direction:column;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden;max-width:800px;margin:0 auto;width:100%}
  .card:hover{border-color:var(--border-strong);transform:translateY(-4px);box-shadow:0 20px 50px -20px rgba(0,0,0,0.8)}
  .card-head{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
  .card-head h3{font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.4}
  .tag{font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--purple);background:rgba(157,123,255,0.1);border:1px solid rgba(157,123,255,0.2);padding:5px 12px;border-radius:8px;white-space:nowrap}
  .card p.desc{color:var(--muted);font-size:15px;line-height:1.65;margin-bottom:22px}
  
  .code-box{position:relative;background:#08090d;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px;overflow:hidden}
  .code-box::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50px;background:linear-gradient(transparent,#08090d);pointer-events:none}
  .code-box pre{font-family:var(--mono);font-size:13px;line-height:1.7;color:#b4c0d6;white-space:pre-wrap;word-break:break-all;overflow-y:auto;max-height:140px;padding-right:8px}
  .code-box pre::-webkit-scrollbar{width:4px}
  .code-box pre::-webkit-scrollbar-thumb{background:#2a3142;border-radius:4px}
  
  .card-actions{display:flex;gap:14px}
  .card-actions .btn{flex:1;padding:14px 24px;font-size:14.5px}
  
  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:650;padding:12px 22px;border-radius:12px;background:linear-gradient(135deg,var(--blurple),#4752e0);color:#fff;transition:all 0.25s;text-decoration:none;box-shadow:0 4px 15px rgba(88,101,242,0.3)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(88,101,242,0.4);filter:brightness(1.1)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);box-shadow:none}
  .btn.ghost:hover{background:var(--surface-3);border-color:var(--border-strong);box-shadow:0 4px 15px rgba(0,0,0,0.2)}
  
  /* Toast */
  #toast{position:fixed;bottom:40px;left:50%;transform:translate(-50%,30px);background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);padding:14px 24px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 20px 60px -15px rgba(0,0,0,0.9);opacity:0;pointer-events:none;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);z-index:300;backdrop-filter:blur(10px)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  
  /* Mobile Nav */
  .mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(16,18,26,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:12px 16px;justify-content:space-around;z-index:150;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:650;background:none;border:none;cursor:pointer;font-family:inherit;transition:color 0.2s}
  .mobile-nav-item.active{color:var(--blurple-2)}
  .mobile-nav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  
  /* Responsive */
  @media (max-width:1024px){.main-content{padding:0 32px 120px}}
  @media (max-width:860px){
    body{display:block}
    .sidebar{display:none}
    .main-content{margin-left:0;padding:0 20px 120px}
    .mobile-nav{display:flex}
    .hero{padding:60px 0 50px}
    h1{font-size:34px}
    .sub{font-size:15px}
    .grid{grid-template-columns:1fr;gap:16px}
    .card{padding:24px}
  }
</style>
</head>
<body>

<div class="ambient-bg"></div>

<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <span class="logo-dot"></span>
      <span>Aetherius X Hub Community</span>
    </div>
    <nav class="nav-links">
      <button class="nav-link active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Dashboard
      </button>
      <button class="nav-link" data-tab="scripts">
        <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        Loadstring
      </button>
    </nav>
    <div class="sidebar-footer">
      <a class="btn" id="joinBtn" href="https://discord.com/invite/WM7jy8hRgn" target="_blank" rel="noopener">Join Discord</a>
      <div class="version-tag">v5.0.0</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <section id="home" class="hero">
      <div class="pill">
        <span class="live-dot"></span>
        <b id="memberCount">—</b> members 
        <span class="approx-badge" title="Discord API provides approximate counts">APPROX</span>
      </div>
      <h1>Aetherius X Hub <span>Community</span></h1>
      <p class="sub">Premium loadstrings, kept up to date and ready to paste. No sketchy redirects, no dead links.</p>
    </section>

    <section id="scripts">
      <div class="section-head">
        <div>
          <h2>Available loadstrings</h2>
          <p>Click copy, paste into your executor, done.</p>
        </div>
        <span class="count-tag" id="lsCount">1 script</span>
      </div>
      <div class="grid" id="lsGrid"></div>
    </section>
  </main>
</div>

<!-- Mobile Nav -->
<nav class="mobile-nav">
  <button class="mobile-nav-item active" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    Home
  </button>
  <button class="mobile-nav-item" data-tab="scripts">
    <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
    Script
  </button>
  <a class="mobile-nav-item" href="https://discord.com/invite/WM7jy8hRgn" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"></path><path d="M6 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"></path></svg>
    Discord
  </a>
</nav>

<div id="toast"></div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const SCRIPT = {
  name: "Old Dragon Blox Ultimate",
  tag: "Autofarms",
  description: "Autofarms",
  code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/Aetherius-X-Hub-Community/Aetherius-X-Hub-Community-script/refs/heads/main/obfuscated_script-1790407913112.lua"))()'
};

const INVITE_CODE = "WM7jy8hRgn";

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "loadstring";

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } 
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    document.body.removeChild(ta);
    return ok;
  }
}

function download(filename, content) {
  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =========================================================
   RENDER SCRIPT
   ========================================================= */
function renderScript() {
  const grid = $("lsGrid");
  
  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = `
    <div class="card-head">
      <h3>${esc(SCRIPT.name)}</h3>
      <span class="tag">${esc(SCRIPT.tag)}</span>
    </div>
    <p class="desc">${esc(SCRIPT.description)}</p>
    <div class="code-box"><pre><code></code></pre></div>
    <div class="card-actions">
      <button class="btn copy-btn">Copy Loadstring</button>
      <button class="btn ghost dl-btn">Download</button>
    </div>
  `;
  
  card.querySelector("code").textContent = SCRIPT.code;

  card.querySelector(".copy-btn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const ok = await copyText(SCRIPT.code);
    if (ok) {
      btn.textContent = "Copied!";
      toast("Loadstring copied to clipboard");
      setTimeout(() => (btn.textContent = "Copy Loadstring"), 1800);
    } else {
      toast("Copy failed — select it manually");
    }
  });

  card.querySelector(".dl-btn").addEventListener("click", () => {
    download("old-dragon-blox-ultimate.lua", SCRIPT.code);
    toast("Downloading old-dragon-blox-ultimate.lua");
  });

  grid.appendChild(card);
}

/* =========================================================
   DISCORD MEMBER COUNT
   ========================================================= */
async function fetchMembers() {
  const el = $("memberCount");
  try {
    const res = await fetch(`https://discord.com/api/v9/invites/${INVITE_CODE}?with_counts=true`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const total = data.approximate_member_count;
    if (typeof total === 'number') {
      el.textContent = total.toLocaleString();
      return;
    }
    throw new Error("No count");
  } catch (err) {
    console.warn("Member fetch failed:", err.message);
    el.textContent = "—";
  }
}

/* =========================================================
   NAVIGATION
   ========================================================= */
function switchTab(tabId) {
  document.querySelectorAll('.nav-link, .mobile-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tabId);
  });
  const target = document.getElementById(tabId);
  if (target) window.scrollTo({ top: target.offsetTop - 30, behavior: 'smooth' });
}

document.querySelectorAll('[data-tab]').forEach(btn => {
  btn.addEventListener('click', (e) => { e.preventDefault(); switchTab(btn.dataset.tab); });
});

window.addEventListener('scroll', () => {
  const sections = document.querySelectorAll('section[id]');
  let current = 'home';
  sections.forEach(sec => { if (window.scrollY >= sec.offsetTop - 120) current = sec.id; });
  document.querySelectorAll('.nav-link, .mobile-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === current);
  });
});

/* =========================================================
   BOOT
   ========================================================= */
renderScript();
fetchMembers();
setInterval(fetchMembers, 5 * 60 * 1000);
</script>
</body>
</html>
